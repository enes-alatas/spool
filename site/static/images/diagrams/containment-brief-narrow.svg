<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="title desc">
  <title id="title">What contains a loop, in brief</title>
  <desc id="desc">Each loop runs in its own container on an internal network. Its only way out is the egress proxy, which reaches the hosts on your allowlist and one hub port that serves only what loops use. The control room and its API are not reachable from a loop. A bare loop has no container: it runs under your account, with your files and your network.</desc>
  <style>
    /* The docs site's diagram style (CONVENTIONS.md "Docs site diagrams"): the
       control room's tokens on its canvas. Cards for things, orange for the
       path a message takes, grey for what comes back or is copied. */
    .canvas { fill: #050505; }
    .card { fill: #0c0c0e; stroke: #24242a; stroke-width: 1.5; }
    .region { fill: none; stroke: #24242a; stroke-width: 1.5; }
    .name { font: 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #f2f1ed; }
    .note { font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #86868b; }
    .section { font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #86868b; letter-spacing: 0.04em; }
    .path { stroke: #ff8a1f; stroke-width: 2; fill: none; }
    .path-note { font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #ff8a1f; }
    .back { stroke: #86868b; stroke-width: 1.5; fill: none; }
    .copy { stroke: #86868b; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .rail { stroke: #24242a; stroke-width: 2; }
    .awake { stroke: #ff8a1f; stroke-width: 4; stroke-linecap: round; }
    .wake { fill: #050505; stroke: #f2f1ed; stroke-width: 2; }
    .wake-name { font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #f2f1ed; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>
  <defs>
    <marker id="head-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a1f"/></marker>
    <marker id="head-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#86868b"/></marker>
  </defs>
  <rect class="canvas" width="360" height="470"/>

  <rect class="region" x="16" y="20" width="328" height="96" rx="12"/>
  <text class="section" x="30" y="42">INTERNAL NETWORK</text>
  <rect class="card" x="36" y="56" width="288" height="48" rx="10"/>
  <text class="name mid" x="180" y="78">a loop</text>
  <text class="note mid" x="180" y="95">its container</text>

  <rect class="card" x="105" y="150" width="150" height="52" rx="10"/>
  <text class="name mid" x="180" y="174">egress proxy</text>
  <text class="note mid" x="180" y="192">the only route</text>
  <line class="path" x1="180" y1="104" x2="180" y2="150" marker-end="url(#head-path)"/>

  <rect class="card" x="16" y="240" width="150" height="52" rx="10"/>
  <text class="name mid" x="91" y="264">allowed hosts</text>
  <text class="note mid" x="91" y="282">your allowlist</text>
  <line class="back" x1="130" y1="202" x2="130" y2="240" marker-end="url(#head-back)"/>
  <rect class="card" x="194" y="240" width="150" height="52" rx="10"/>
  <text class="name mid" x="269" y="264">one hub port</text>
  <text class="note mid" x="269" y="282">what loops use</text>
  <line class="path" x1="230" y1="202" x2="230" y2="240" marker-end="url(#head-path)"/>
  <rect class="card" x="194" y="310" width="150" height="52" rx="10"/>
  <text class="name mid" x="269" y="334">control room</text>
  <text class="note mid" x="269" y="352">not reachable</text>

  <text class="section" x="16" y="396">BARE</text>
  <rect class="card" x="16" y="406" width="328" height="52" rx="10"/>
  <text class="name mid" x="180" y="430">a bare loop</text>
  <text class="note mid" x="180" y="448">your account, files, network</text>
</svg>
