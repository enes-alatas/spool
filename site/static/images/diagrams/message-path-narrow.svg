<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="title desc">
  <title id="title">How a message travels to a loop and back</title>
  <desc id="desc">You write on Telegram, Slack or the control room. A Telegram or Slack message reaches the loop's bot, which hands it to the hub; the control room talks to the hub directly. The hub wakes the loop, and its reply goes back the same way. A loop's message to another loop stays inside the hub, and the sender's bot mirrors it to the group. Below, a loop's day: asleep, costing nothing, until a tick, a message, a background command's exit or the wake it asked for.</desc>
  <style>
    /* The docs site's diagram style (CONVENTIONS.md "Docs site diagrams"): the
       control room's tokens on its canvas. Cards for things, orange for the
       path a message takes, grey for what comes back or is copied. */
    .canvas { fill: #050505; }
    .card { fill: #0c0c0e; stroke: #24242a; stroke-width: 1.5; }
    .region { fill: none; stroke: #24242a; stroke-width: 1.5; }
    .name { font: 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #f2f1ed; }
    .note { font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #86868b; }
    .section { font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #86868b; letter-spacing: 0.04em; }
    .path { stroke: #ff8a1f; stroke-width: 2; fill: none; }
    .path-note { font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #ff8a1f; }
    .back { stroke: #86868b; stroke-width: 1.5; fill: none; }
    .copy { stroke: #86868b; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .rail { stroke: #24242a; stroke-width: 2; }
    .awake { stroke: #ff8a1f; stroke-width: 4; stroke-linecap: round; }
    .wake { fill: #050505; stroke: #f2f1ed; stroke-width: 2; }
    .wake-name { font: 12px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #f2f1ed; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>
  <defs>
    <marker id="head-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a1f"/></marker>
    <marker id="head-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#86868b"/></marker>
  </defs>
  <rect class="canvas" width="360" height="640"/>

  <!-- you -->
  <text class="section" x="10" y="26">YOU</text>
  <rect class="card" x="10" y="42" width="100" height="44" rx="10"/>
  <text class="name mid" x="60" y="69">Telegram</text>
  <rect class="card" x="120" y="42" width="104" height="44" rx="10"/>
  <text class="name mid" x="172" y="69">Slack</text>
  <rect class="card" x="234" y="42" width="116" height="44" rx="10"/>
  <text class="name mid" x="292" y="69">control room</text>

  <!-- the loop's bot -->
  <rect class="card" x="10" y="142" width="220" height="68" rx="10"/>
  <text class="name mid" x="120" y="166">the loop’s bot</text>
  <text class="note mid" x="120" y="184">Telegram bot</text>
  <text class="note mid" x="120" y="200">or Slack app</text>
  <line class="path" x1="60" y1="86" x2="60" y2="142" marker-end="url(#head-path)"/>
  <line class="path" x1="172" y1="86" x2="172" y2="142" marker-end="url(#head-path)"/>

  <!-- the hub and two loops -->
  <rect class="region" x="10" y="296" width="340" height="182" rx="12"/>
  <text class="section" x="26" y="320">HUB</text>
  <rect class="card" x="20" y="354" width="150" height="52" rx="10"/>
  <text class="name mid" x="95" y="378">gardener</text>
  <text class="note mid" x="95" y="396">a loop</text>
  <rect class="card" x="205" y="354" width="140" height="52" rx="10"/>
  <text class="name mid" x="275" y="378">courier</text>
  <text class="note mid" x="275" y="396">another loop</text>
  <line class="path" x1="75" y1="210" x2="75" y2="354" marker-end="url(#head-path)"/>
  <line class="back" x1="115" y1="354" x2="115" y2="210" marker-end="url(#head-back)"/>
  <text class="path-note end" x="69" y="270">message</text>
  <text class="note" x="121" y="270">reply</text>
  <line class="path" x1="330" y1="86" x2="330" y2="354" marker-end="url(#head-path)"/>
  <polyline class="path" points="95,406 95,440 275,440 275,406" marker-end="url(#head-path)"/>
  <text class="path-note mid" x="187" y="460">loop to loop</text>
  <line class="copy" x1="187" y1="436" x2="187" y2="210" marker-end="url(#head-back)"/>
  <text class="note" x="195" y="230">mirrored to</text>
  <text class="note" x="195" y="246">the group by</text>
  <text class="note" x="195" y="262">the sender’s bot</text>

  <!-- a loop's day -->
  <text class="section" x="10" y="520">A LOOP’S DAY</text>
  <text class="note mid" x="110" y="560">asleep: costs nothing</text>
  <line class="rail" x1="10" y1="578" x2="350" y2="578"/>
  <line class="awake" x1="30" y1="578" x2="50" y2="578"/>
  <line class="awake" x1="110" y1="578" x2="125" y2="578"/>
  <line class="awake" x1="205" y1="578" x2="225" y2="578"/>
  <line class="awake" x1="305" y1="578" x2="335" y2="578"/>
  <circle class="wake" cx="30" cy="578" r="5"/>
  <text class="wake-name mid" x="30" y="604">tick</text>
  <circle class="wake" cx="110" cy="578" r="5"/>
  <text class="wake-name mid" x="110" y="604">message</text>
  <circle class="wake" cx="205" cy="578" r="5"/>
  <text class="wake-name mid" x="205" y="604">command exit</text>
  <circle class="wake" cx="305" cy="578" r="5"/>
  <text class="wake-name mid" x="305" y="604">next-wake</text>
</svg>
