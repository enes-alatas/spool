    <title>spool</title>
    <!-- The spool glyph, as the README banner draws it (#316). The SVG follows
         the browser's light or dark scheme; the PNGs are for browsers that
         take no SVG icon and for iOS, which wants an opaque square. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The control room's one canvas colour (--canvas), for browser chrome
         that tints itself to the page. -->
    <meta name="theme-color" content="#050505" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
