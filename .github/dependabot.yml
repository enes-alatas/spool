# Keeps the commit-SHA pins in .github/workflows current (#707): a pin that
# never moves misses the action's own security fixes. Dependabot bumps the SHA
# and its `# vX.Y.Z` comment together, one grouped PR a week. Go modules and
# npm are not here: their version updates are a separate decision, and their
# security alerts reach the board without this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
