name: Refactor
description: Restructure code without changing caller-visible behavior
labels: ["refactor"]
body:
  - type: textarea
    id: current-shape
    attributes:
      label: Current shape
      description: 'File/path map of the structure being changed and what makes it costly, one path per line. If this is a child of an epic: write `Part of #n` here and attach it as a sub-issue of #n after filing.'
    validations:
      required: true
  - type: textarea
    id: target-shape
    attributes:
      label: Target shape
      description: The structure after the refactor and what it makes cheaper.
    validations:
      required: true
  - type: input
    id: seams-adrs
    attributes:
      label: Seams / ADRs touched
      description: Any seam (Surface, SandboxRuntime, Store, Runner) or ADR this change touches; leave blank if none.
      placeholder: Runner — ADR-0004
  - type: checkboxes
    id: behavior-contract
    attributes:
      label: Behavior contract
      options:
        - label: Caller-visible behavior is unchanged by this refactor.
          required: true
  - type: input
    id: out-of-scope
    attributes:
      label: Out of scope
      description: One line on what this issue does not cover.
    validations:
      required: true
