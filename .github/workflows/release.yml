# Builds what a release carries (ADR-0052): the spool binaries for Linux
# and macOS with the control room embedded, SHA256SUMS over them, and a
# GitHub attestation of each, so an operator installs without Go or Node
# and can check that this workflow built what they downloaded.
#
# The operator tags (CONVENTIONS.md, #223), with `git push origin <tag>`
# or `gh release create <tag> --generate-notes`. Either fires this. The
# build is scripts/release-build.sh, which anyone can run to get the same
# bytes from the same commit.
name: release

on:
  push:
    tags: ['v*']
  # A dry run from a branch or main: it builds and keeps the archives as a
  # workflow artifact, and attests and publishes nothing. Its only grant is
  # contents: read (CONVENTIONS.md, "Proving an event-driven workflow").
  workflow_dispatch:

# Every job names its own grant.
permissions: {}

# A tag is built once at a time; a second push of it waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is git describe's, which needs the tags (#229).
          fetch-depth: 0
          persist-credentials: false

      # A release is cut from main (ADR-0052 decision 2): a tag on a
      # commit main never had would publish code no review passed.
      - name: the tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; a release is cut from main"
            exit 1
          fi

      # No cache, Go's or npm's: a release is built from the lockfiles
      # alone, never from a cache another workflow wrote.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: build
        run: scripts/release-build.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Only a tag reaches this job, so only a tag holds its grants.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release and its assets
      id-token: write # the attestations' signing identity
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # A release created with `gh release create` already exists, and a
      # bare tag push gets one here, titled with its tag (#485) and its
      # notes generated. --clobber lets a re-run replace its own assets.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
