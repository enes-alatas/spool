# A pull request from a fork is labelled `community` and
# `needs-security-review` and gets one fixed comment, the moment it is opened
# (ADR-0069 item 1, #1473).
#
# Why pull_request_target, the repository's only use of it. A fork PR's
# `pull_request` runs wait for the operator's approval (the repository's
# fork-PR approval policy is "all external contributors") and get a read-only
# token, so pr-guards can neither run on time nor label anything. A
# `pull_request_target` run is the base branch's workflow, with this file's
# grant, and starts without approval.
#
# What makes that safe here, and what workflow-lint rule 7 holds every
# pull_request_target workflow to:
# - The checkout has no `ref:` and no `repository:`, so it is the base
#   branch's commit. The script that runs is the base branch's copy, which
#   the PR can't change. Nothing of the PR's head is fetched, built or run.
# - No event field but the PR's number reaches the step. The script reads
#   `head.repo.fork` and `author_association` from $GITHUB_EVENT_PATH and
#   nothing else: no title, body, branch name or login.
# - The grant is the two scopes the calls need, and the checkout keeps no
#   credential.
name: community-pr

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number to run against
        required: true
      # Stand in for the payload's head.repo.fork and author_association, so
      # the path can be proved on a maintainer's own PR (#209). Left empty,
      # the PR's own are fetched.
      fork:
        description: treat the PR's head as in a fork (true or false); empty fetches it
        required: false
      author_association:
        description: the author association to treat the PR's author as (e.g. NONE); empty fetches it
        required: false

permissions: {}

concurrency:
  group: community-pr-${{ github.event.pull_request.number || inputs.pr }}

jobs:
  welcome:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Cheap first cut from the event; the script checks again, and is the
    # check a dispatch relies on.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork
    # The label goes through the issues endpoint, which on a PR needs
    # pull-requests: write (#743); issues: read is what workflow-lint rule 5
    # asks of an issues-endpoint call. contents: read is the base checkout.
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: label and welcome a pull request from a fork
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.pull_request.number || inputs.pr }}
        run: bash scripts/community-pr.sh
