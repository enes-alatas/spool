# Takes a credential-shaped string out of an issue or comment body as soon as
# it is posted (#151, guard 2 of 2).
#
# This is the surface the 2026-09-18 incident happened on (#146): a working
# bot token pasted into an issue body as evidence, read by everyone with
# access, caught by nobody. The PR-diff scan in ci.yml cannot help here —
# there is no diff, and by the time anything runs the text is already
# published — so this workflow does the only two useful things left. It takes
# the value out of what people read, and it tells the author the three things
# they will otherwise get wrong: that the edit history still holds it, that
# deleting the revision is their job, and that rotating is not optional.
#
# The rules come from scripts/secret-rules.awk, the same file the PR scan
# reads, so the two guards cannot drift.
name: secret-redact

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write

# One at a time per body. Two events for the same text — an edit landing while
# the open is still being scanned — would otherwise race to write it back, and
# the loser would restore the value the winner removed.
concurrency:
  group: secret-redact-${{ github.event.comment.id || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: take any credential shape out of the body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Read through the environment, never interpolated into the script:
          # a body is attacker-controlled text, and `${{ }}` inside a `run:`
          # block is pasted before the shell ever sees it.
          BODY: ${{ github.event.comment.body || github.event.issue.body }}
          # Where the body lives, so it can be written back.
          TARGET: >-
            ${{ github.event_name == 'pull_request_review_comment'
                && format('repos/{0}/pulls/comments/{1}', github.repository, github.event.comment.id)
                || (github.event_name == 'issue_comment'
                    && format('repos/{0}/issues/comments/{1}', github.repository, github.event.comment.id)
                    || format('repos/{0}/issues/{1}', github.repository, github.event.issue.number)) }}
          # Where the incident note goes: the thread the body sits in. A review
          # comment's thread is the pull request, which is an issue for this.
          THREAD: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -uo pipefail
          printf '%s' "$BODY" > body.md
          # An issue opened with no body at all: nothing to read, nothing to do.
          [ -s body.md ] || exit 0

          bash scripts/secret-redact.sh < body.md > redacted.md 2>/dev/null
          status=$?
          # Its own edit fires this workflow again; the marker holds no shape,
          # so the second run ends here rather than looping.
          [ "$status" -eq 0 ] && exit 0

          # Only 1 means "replaced something". Any other status is the guard
          # failing — an unreadable rules file, an awk that died mid-body —
          # and treating that as a hit would PATCH a truncated body over the
          # report while posting a note saying it had been handled. The
          # original would then survive only in the revision history the note
          # tells the author to delete. Fail loudly and leave the body alone.
          if [ "$status" -ne 1 ] || [ ! -s redacted.md ]; then
            echo "secret-redact exited $status; leaving the body untouched" >&2
            exit 1
          fi

          # Checked, because the note that follows says the value is gone. A
          # failed write with the note posted anyway is worse than silence:
          # it tells the author to stop worrying about a credential still
          # sitting in the text above it.
          if ! gh api --method PATCH "$TARGET" -F body=@redacted.md --silent; then
            echo "could not write the redacted body back" >&2
            exit 1
          fi

          # Deliberately says nothing about what was found. The count, the
          # shape and the position are all facts about a value that has just
          # been taken out of public view; a workflow that narrates them puts
          # half of it back. The copy lives in a file rather than a heredoc
          # here so it can be read and edited as prose.
          gh api --method POST "repos/$REPO/issues/$THREAD/comments" \
            -F body=@.github/secret-redact-note.md --silent || exit 1
