# The two guards that run on an issue or comment event: take any credential
# shape out of the body (#151, guard 2 of 2), and flag an issue that arrived
# without a type label (ADR-0014).
#
# They are one workflow because they are one runner. A started job bills a
# full minute whatever it does, and these do ten seconds of work each; as two
# workflows an `issues: opened` event started two runners and billed two
# minutes to do twenty seconds (#232). Same scripts, same steps, and the step
# summary names whichever acted, so a run still says which guard did what.
#
# One condition did widen: the typing guard now also runs when an issue body
# is edited, which its own workflow did not subscribe to. It is free — the
# runner is already up for the redaction guard, which does subscribe to
# `edited` — and idempotent, since it reads the labels and writes only when
# they disagree with it. Narrowing it back would be three more words of
# condition to buy nothing.
#
# The redaction half is the surface the 2026-09-18 incident happened on
# (#146): a working bot token pasted into an issue body as evidence, read by
# everyone with access, caught by nobody. The PR-diff scan in ci.yml cannot
# help here — there is no diff, and by the time anything runs the text is
# already published — so it does the only two useful things left. It takes
# the value out of what people read, and it tells the author the three things
# they will otherwise get wrong: that the edit history still holds it, who can
# delete that revision — a person themselves, a loop never, since there is no
# API for it (#206) — and that rotating is not optional either way.
#
# The rules come from scripts/secret-rules.awk, the same file the PR scan
# reads, so the two guards cannot drift.
#
# The file is still secret-redact.yml, which no longer matches the name. That
# is deliberate and it is the lesser defect: `workflow_dispatch` resolves a
# workflow by its path on the default branch, so a renamed file 404s on every
# dispatch until it merges (CONVENTIONS.md, "Proving an event-driven
# workflow"). Moving it would mean merging this fold unproven — the exact way
# #203, #207 and #209 shipped. Renaming the path is a separate, cheap commit
# for whoever wants it once this is on main.
name: issue-guards

on:
  # The union of what the two guards used to trigger on. `labeled` and
  # `unlabeled` are the typing guard's — they are how it clears its own flag
  # once someone types the issue — and `edited` is the redactor's.
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  # The same guards, runnable from a branch. Nothing else exercises this
  # workflow — PR CI never fires an issue event — so a change to it merged
  # unproven three times and broke three times (#203, #207, #209). The inputs
  # stand in for the event payload: given a number, a guard fetches the body
  # or the labels the event would have carried, and every line after that is
  # the real path.
  #
  # Accepted with this trigger (#209, on the PR that added it): anyone with
  # write access can now run a body rewrite on demand, against any issue or
  # comment in the repo. It is allowed because the job only ever removes
  # credential shapes and posts a note — it restores nothing, deletes nothing,
  # and a body holding no shape is left untouched — and because the same
  # people can already edit any body by hand. If this job ever gains an
  # action beyond redacting, that reasoning expires with it.
  workflow_dispatch:
    inputs:
      issue:
        description: issue or pull request number to run the guards against
        required: true
      guard:
        description: which guard to run
        required: false
        default: both
        type: choice
        options: [both, redact, type]
      comment:
        description: comment id, when the body to scan is a comment on it
        required: false
      kind:
        description: which body the number names
        required: false
        default: issue
        type: choice
        options: [issue, issue_comment, pull_request_review_comment]

# An explicit block is a whole grant, not an addition to the default one: the
# write scopes below silently set every other scope to none, including the
# `contents: read` that `actions/checkout` needs to clone a private repo. The
# checkout failed on every issue and comment event, which left the guard inert
# — red, but inert — for as long as it took someone to read the mail (#203).
permissions:
  contents: read
  issues: write
  pull-requests: write

# One at a time per body. Two events for the same text — an edit landing while
# the open is still being scanned — would otherwise race to write it back, and
# the loser would restore the value the winner removed.
concurrency:
  group: issue-guards-${{ github.event.comment.id || github.event.issue.number || inputs.comment || inputs.issue }}
  cancel-in-progress: false

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not on `labeled`, `unlabeled` or `reopened`: those carry the body the
      # last `opened` or `edited` event already had scanned, and a redaction
      # is itself an `edited` event, so re-running here would re-scan the same
      # text every time somebody typed an issue.
      - name: take any credential shape out of the body
        if: >-
          (github.event_name != 'workflow_dispatch'
            && (github.event.action == 'opened'
              || github.event.action == 'edited'
              || github.event.action == 'created'))
          || (github.event_name == 'workflow_dispatch' && inputs.guard != 'type')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The body is not passed in, on either path. A step's `env:` map is printed in its
        # "Run" group header, so handing it the text would copy a credential
        # out of a published issue and into an Actions log (#207); the script
        # reads it from the event file the runner wrote to disk. Nothing about
        # the event is interpolated into the shell either — `${{ }}` is pasted
        # before bash sees it, and a body is attacker-controlled text.
        run: bash scripts/secret-redact-body.sh

      # Mandatory issue typing (ADR-0014): issue forms pre-apply a type label,
      # but gh/API filings bypass forms — this flags anything that arrives
      # untyped, and clears the flag once it is typed. Issues only; a comment
      # event carries no issue to type, and a dispatch naming a comment is
      # pointed at a body, not at an issue's labels.
      - name: flag issues without a type label
        if: >-
          github.event_name == 'issues'
          || (github.event_name == 'workflow_dispatch'
            && inputs.guard != 'redact' && inputs.kind == 'issue')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || inputs.issue }}
        run: |
          types='bug|new feature|improvement|refactor|chore|security|documentation|question'
          labels=$(gh issue view "$NUM" -R "$REPO" --json labels -q '.labels[].name')
          n=$(grep -cE "^($types)$" <<<"$labels" || true)
          if [ "$n" -eq 0 ]; then
            gh issue edit "$NUM" -R "$REPO" --add-label needs-type
            echo "Issue #$NUM has no type label — flagged \`needs-type\`." >> "$GITHUB_STEP_SUMMARY"
          elif grep -qxF 'needs-type' <<<"$labels"; then
            gh issue edit "$NUM" -R "$REPO" --remove-label needs-type
            echo "Issue #$NUM is typed — cleared \`needs-type\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Issue #$NUM is typed — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
