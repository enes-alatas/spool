# Takes a credential-shaped string out of an issue or comment body as soon as
# it is posted (#151, guard 2 of 2).
#
# This is the surface the 2026-09-18 incident happened on (#146): a working
# bot token pasted into an issue body as evidence, read by everyone with
# access, caught by nobody. The PR-diff scan in ci.yml cannot help here —
# there is no diff, and by the time anything runs the text is already
# published — so this workflow does the only two useful things left. It takes
# the value out of what people read, and it tells the author the three things
# they will otherwise get wrong: that the edit history still holds it, who can
# delete that revision — a person themselves, a loop never, since there is no
# API for it (#206) — and that rotating is not optional either way.
#
# The rules come from scripts/secret-rules.awk, the same file the PR scan
# reads, so the two guards cannot drift.
name: secret-redact

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  # The same job, runnable from a branch. Nothing else exercises this
  # workflow — PR CI never fires an issue event — so a change to it merged
  # unproven three times and broke three times (#203, #207, #209). The inputs
  # stand in for the event payload: given a number, the job fetches the body
  # the event would have carried, and every line after that is the real path.
  #
  # Accepted with this trigger (#209, on the PR that added it): anyone with
  # write access can now run a body rewrite on demand, against any issue or
  # comment in the repo. It is allowed because the job only ever removes
  # credential shapes and posts a note — it restores nothing, deletes nothing,
  # and a body holding no shape is left untouched — and because the same
  # people can already edit any body by hand. If this job ever gains an
  # action beyond redacting, that reasoning expires with it.
  workflow_dispatch:
    inputs:
      issue:
        description: issue or pull request number holding the body to scan
        required: true
      comment:
        description: comment id, when the body to scan is a comment on it
        required: false
      kind:
        description: which body the number names
        required: false
        default: issue
        type: choice
        options: [issue, issue_comment, pull_request_review_comment]

# An explicit block is a whole grant, not an addition to the default one: the
# two write scopes below silently set every other scope to none, including the
# `contents: read` that `actions/checkout` needs to clone a private repo. The
# checkout failed on every issue and comment event, which left the guard inert
# — red, but inert — for as long as it took someone to read the mail (#203).
permissions:
  contents: read
  issues: write
  pull-requests: write

# One at a time per body. Two events for the same text — an edit landing while
# the open is still being scanned — would otherwise race to write it back, and
# the loser would restore the value the winner removed.
concurrency:
  group: secret-redact-${{ github.event.comment.id || github.event.issue.number || inputs.comment || inputs.issue }}
  cancel-in-progress: false

jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: take any credential shape out of the body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The body is not passed in, on either path. A step's `env:` map is printed in its
        # "Run" group header, so handing it the text would copy a credential
        # out of a published issue and into an Actions log (#207); the script
        # reads it from the event file the runner wrote to disk. Nothing about
        # the event is interpolated into the shell either — `${{ }}` is pasted
        # before bash sees it, and a body is attacker-controlled text.
        run: bash scripts/secret-redact-body.sh
