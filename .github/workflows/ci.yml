# CI gates per docs/QUALITY.md (ADR-0013): lint, unit (tier 1, incl. arch
# tests), integration vs fakeclaude (tier 2), web lint+build, govulncheck.
# Coverage is informational (job summary), never a gate.
#
# What runs when is a cost decision, not a quality one (#181, #232). GitHub
# bills a started job a whole minute however little it does. While the repo
# was private that came out of a capped allowance. It has been public since
# 2026-09-21, so the minutes are free, but they are still runner time and
# wall time on every PR. Five rules keep that spend proportionate; none of
# them weakens a gate:
#
#   1. A superseded run is cancelled. Review-fix force-pushes routinely
#      produced 3-7 runs of the same PR, all but the last of them answering
#      a question nobody was asking any more.
#   2. The short checks are one job, not four. Go, web, the secret scans and
#      the workflow lint each did well under a minute of work and each billed
#      a full one; as steps of `checks` they bill about two minutes together
#      and keep their own path filters as step-level `if:`s. The price is ~1
#      minute of wall time, since they no longer run in parallel.
#   3. `itest` is skipped outright when nothing it covers changed. It is ~8
#      of the ~10 minutes a full run used to bill, so it is the one worth a
#      job-level `if:` — and a job skipped that way still reports a check,
#      concluded `skipped`, which branch protection counts as passed (#1).
#      A no-op step would have billed a minute to say it had nothing to do.
#   4. A push to main runs tier 1 only. Rebase-merge (ADR-0016) lands the
#      commits a PR already proved green, so the full matrix is a re-run.
#      The gap this leaves is a merge from a stale base. The merge queue
#      closes it (ADR-0054): its required `queue` check runs these gates on
#      the PR rebased onto the main it lands on, by calling this workflow.
#      The tier-1 steps here stay the smoke for a mechanical mismerge.
#   5. `itest` is skipped when the content it covers already passed it on
#      this PR (#314). Rebase-merge makes two to five force-pushes per PR
#      the norm — a reworded commit, a docs-only fold, a rebase onto a main
#      that moved elsewhere — and each re-ran eight minutes on Go content
#      already proved. A green `itest` leaves a cache marker keyed on a hash
#      of the covered tree; a later run of the same PR that hashes the same
#      finds it and skips. Any byte of covered content changed is a new key.
#      A PR reads markers of its own runs and of main, never another PR's,
#      so no PR can vouch for another's content.
#
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue calls these gates on the head of the queue, rebased onto
  # main (#819, ADR-0054). Each job puts that tree in place after its
  # checkout; everything after reads it as a PR's.
  workflow_call:
    inputs:
      pr:
        type: number
        required: true
      head:
        type: string
        required: true
      base:
        type: string
        required: true

# One run per PR. `head_ref` is empty on a push, so pushes to main fall back
# to their own run id and are never cancelled by each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts of the tree this event touched. A push to main sets only
  # `unit`: lever 4 above, expressed once here rather than as an event-name
  # condition on each job.
  #
  # This job reports a check of its own, and branch protection has to require
  # it (#1). Everything below is `needs: changes`, and a job whose dependency
  # failed is skipped — a conclusion, which branch protection counts as
  # passed. The step below guards the same hole from inside; requiring this
  # check is what closes it from outside.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      # `unit` gates the tier-1 steps of `checks`, and it is the only flag a
      # push to main sets: see lever 4 above.
      unit: ${{ steps.filter.outputs.unit }}
      # `itest` is the filter's answer less what lever 5 trusts, and
      # `itest_key` the marker a green run of it leaves behind.
      itest: ${{ steps.trust.outputs.itest }}
      itest_key: ${{ steps.covered.outputs.key }}
      web: ${{ steps.filter.outputs.web }}
      smoke: ${{ steps.filter.outputs.smoke }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The merge queue's run (#819): the tree under test is the queued PR
      # rebased onto main, not what the caller's event checked out.
      - name: the queued PR, rebased onto main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          BASE_SHA: ${{ inputs.base }}
        run: bash scripts/queue-tree.sh "$PR" "$HEAD_SHA" "$BASE_SHA"
      - id: filter
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          QUEUE_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] && [ -z "$QUEUE_PR" ]; then
            printf 'unit=true\nitest=false\nweb=false\nsmoke=false\nlockfile=false\nworkflows=false\n' >> "$GITHUB_OUTPUT"
            echo 'Push to main: unit tests only — this content was green on its PR (ADR-0016).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "changed files:"; echo "$files"
          # Anything that can change what the binary does or how it is
          # judged — .golangci.yml configures the lint that gates it — plus
          # this workflow: a change to the gates must prove itself under
          # them. A path that belongs in no bucket runs nothing, so the
          # cost of forgetting one here is a gate that silently stops
          # running; add to these rather than trimming them.
          go=false
          web=false
          smoke=false
          lockfile=false
          workflows=false
          if echo "$files" | grep -qE '^(cmd/|internal/|itest/|go\.(mod|sum)$|Makefile$|\.golangci\.ya?ml$|\.github/workflows/)'; then
            go=true
          fi
          if echo "$files" | grep -qE '^(web/|\.github/workflows/)'; then
            web=true
          fi
          # The browser smoke walks the room on a hub cmd/uifixture seeded,
          # launched by scripts/fixture-hub.sh, so a change to either can
          # break it as surely as one to web/ (#356).
          if echo "$files" | grep -qE '^(web/|cmd/uifixture/|scripts/fixture-hub\.sh$|\.github/workflows/)'; then
            smoke=true
          fi
          # A lockfile change is the one place a PR brings in a dependency, so it
          # is where npm audit gates (#737). On every web PR, an advisory against
          # a dependency the PR never touched would block it; the daily
          # `advisories` scan files those instead.
          if echo "$files" | grep -qxF web/package-lock.json; then
            lockfile=true
          fi
          if echo "$files" | grep -qE '^(\.github/workflows/|\.github/security-review-paths$|scripts/)'; then
            workflows=true
          fi
          printf 'unit=%s\nitest=%s\nweb=%s\nsmoke=%s\nlockfile=%s\nworkflows=%s\n' "$go" "$go" "$web" "$smoke" "$lockfile" "$workflows" >> "$GITHUB_OUTPUT"

      # Lever 5. The content `itest` covers, as git already names it: the
      # tree id of each covered directory and the blob id of each covered
      # file, hashed together. HEAD is the merge of the PR into its base,
      # which is what `itest` checks out and tests, so a base that moved in
      # covered content moves the key too. `docker/` is in the hash though
      # not in the filter: `make itest` builds the egress image from it, and
      # a hash that is too wide only costs a re-run.
      - id: covered
        if: steps.filter.outputs.itest == 'true'
        run: |
          set -euo pipefail
          ids=""
          for path in cmd internal itest docker .github/workflows go.mod go.sum Makefile .golangci.yml; do
            ids+="$path $(git rev-parse --verify --quiet "HEAD:$path" || echo absent)"$'\n'
          done
          printf '%s' "$ids"
          echo "key=itest-green-$(printf '%s' "$ids" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: proved
        if: steps.filter.outputs.itest == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .itest-green
          key: ${{ steps.covered.outputs.key }}
          lookup-only: true
      - id: trust
        env:
          FILTERED: ${{ steps.filter.outputs.itest }}
          PROVED: ${{ steps.proved.outputs.cache-hit }}
          KEY: ${{ steps.covered.outputs.key }}
        run: |
          set -euo pipefail
          if [ "$FILTERED" = true ] && [ "$PROVED" = true ]; then
            echo 'itest=false' >> "$GITHUB_OUTPUT"
            echo "itest skipped: the content it covers already passed it on this PR (marker \`$KEY\`, over cmd/ internal/ itest/ docker/ .github/workflows/ go.mod go.sum Makefile .golangci.yml)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "itest=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  # One job, four areas. Each area keeps its own filter as a step-level `if:`;
  # what went away is three extra runners. A started job bills a whole minute
  # whatever it does (#232), so four one-minute jobs cost four minutes to do
  # about ninety seconds of work. The cost of the fold is ~1 min of wall time
  # per run, paid because these are the short checks; `itest` stays its own
  # job — it is the long one, and the one most often skipped.
  checks:
    needs: changes
    # Runs even when the filter job did not succeed, because one thing here
    # must not be skippable: the secret scans were the one job with no
    # `needs:` before this fold, so a broken filter could not silence them.
    # A cancelled run is still a cancelled run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # As in `changes`: the queued PR rebased onto main (#819).
      - name: the queued PR, rebased onto main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          BASE_SHA: ${{ inputs.base }}
        run: bash scripts/queue-tree.sh "$PR" "$HEAD_SHA" "$BASE_SHA"

      # The secret steps are not path-filtered, and deliberately: a credential
      # can be added to any file, so "this change did not touch the Go tree"
      # says nothing about whether it added a token. It is seconds of runner
      # time (#151).
      - name: the scanner still catches what it claims to
        if: github.event_name == 'pull_request' || inputs.pr
        run: bash scripts/secret-scan-test.sh
      # The redaction guard (secret-redact.yml, the `issue-guards` workflow) fires on issue and comment
      # events, where nothing gates it — this is the only place its rules are
      # checked before they ship, and it shares its pattern list with the scan
      # above, so a change to either arrives here.
      - name: the redactor still takes out what it claims to
        if: github.event_name == 'pull_request' || inputs.pr
        run: bash scripts/secret-redact-test.sh
      # The step that guard runs, under the runner's own `bash -e` — the flag
      # is the difference that let #207 ship: every check passed under plain
      # bash and the guard did nothing on the runner.
      - name: the redaction step still acts on a hit
        if: github.event_name == 'pull_request' || inputs.pr
        run: bash scripts/secret-redact-body-test.sh
      # The welcome step posts on an event no PR fires, so this is the only
      # run it gets before it ships: under `bash -e`, with a stub gh (#503).
      - name: the welcome step still replies once, and only with its note
        if: github.event_name == 'pull_request' || inputs.pr
        run: bash scripts/community-welcome-test.sh
      - name: scan the lines this PR adds
        if: github.event_name == 'pull_request' || inputs.pr
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        run: |
          git diff -U0 "$BASE" HEAD | bash scripts/secret-scan.sh --stdin

      # Everything below reads `needs.changes.outputs.*`, which is empty when
      # the filter job failed — so every area would quietly decide it had
      # nothing to do and this job would go green having run only the scans
      # above. Red instead. It sits here, not first, so a filter failure
      # still gets the secret scans run (#232, finding 1).
      - name: the filter has to have worked
        if: needs.changes.result != 'success'
        run: |
          echo "the changes job concluded '${{ needs.changes.result }}', so no path filter is available and nothing below this step could run." >&2
          exit 1

      # The browser smoke needs Go too: it builds the binary and seeds its hub.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.unit == 'true' || needs.changes.outputs.smoke == 'true'
        with:
          go-version-file: go.mod
      - name: gofmt
        if: needs.changes.outputs.unit == 'true'
        run: |
          out=$(gofmt -l cmd internal itest)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        if: needs.changes.outputs.unit == 'true'
        run: go vet ./...
      - name: go vet as darwin
        if: needs.changes.outputs.unit == 'true'
        run: make vet-darwin
      - name: golangci-lint
        if: needs.changes.outputs.unit == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, so a golangci-lint release can't turn main red on its own
          # (#738). Bump it when go.mod's toolchain moves: a binary built
          # with an older Go refuses a newer toolchain (v2.1 was built with
          # go1.24 and refused go1.25). Dependabot doesn't move this input.
          version: v2.14.0
      # Go and the room's TS and CSS share the comment rule, so either area
      # runs it (CONVENTIONS.md "Comments").
      - name: comments cite no ADR sections
        if: needs.changes.outputs.unit == 'true' || needs.changes.outputs.web == 'true'
        run: bash scripts/comment-refs.sh
      - name: unit tests (tier 1 + arch)
        if: needs.changes.outputs.unit == 'true'
        run: |
          set -o pipefail
          go test -coverprofile=cover.out ./... 2>&1 | tee go-test.log
      # A red test step says only "exit code 1" on the job page, and a
      # loop's box cannot fetch job logs, so its failures are annotated
      # there (#839).
      - name: name the failed tests
        if: failure() && needs.changes.outputs.unit == 'true'
        run: bash scripts/test-failures.sh go-test.log "tier 1"
      # Informational, never a gate (ADR-0013), so a failure here cannot turn
      # the job red. On a PR the report is the changed lines' (#2): which
      # statements the PR adds or edits ran under tier 1, and where the rest
      # are. The whole-repo total follows it, as one line.
      - name: coverage (informational)
        if: needs.changes.outputs.unit == 'true'
        continue-on-error: true
        env:
          EVENT: ${{ inputs.pr && 'queue' || github.event_name }}
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = queue ]; then
            # To a file first: in a pipe, a failed diff (under `bash -e`, no
            # pipefail) would reach the script as an empty change and the
            # summary would say the PR touched no Go.
            git diff -U0 "$BASE" HEAD -- '*.go' > "$RUNNER_TEMP/go.diff"
            bash scripts/diff-coverage.sh cover.out < "$RUNNER_TEMP/go.diff" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          total=$(go tool cover -func=cover.out | awk 'END { print $NF }')
          echo "Whole repo: $total of statements ran under tier 1." >> "$GITHUB_STEP_SUMMARY"
      - name: govulncheck
        if: needs.changes.outputs.unit == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.smoke == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.smoke == 'true'
        working-directory: web
      # The runtime dependencies only, from high up: what the shipped room
      # carries. Dev tooling is listed by the daily `advisories` scan.
      - name: npm audit, when the lockfile changes
        if: needs.changes.outputs.lockfile == 'true'
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
        if: needs.changes.outputs.web == 'true'
        working-directory: web
      - run: npm run format:check
        if: needs.changes.outputs.web == 'true'
        working-directory: web
      - run: npm test
        if: needs.changes.outputs.web == 'true'
        working-directory: web
      - run: npm run build
        if: needs.changes.outputs.web == 'true'
        working-directory: web

      # The browser smoke (#356). The steps above read the source; this opens
      # the room as it ships, `make build` served by bin/spool on a hub
      # cmd/uifixture seeded, and walks it: login, each page, the stream. A
      # page that renders blank or never leaves "Loading…" fails here. On a
      # failure the Playwright trace is kept as an artifact, so the reason is
      # readable without a rerun.
      - name: browser smoke, build the room as it ships
        if: needs.changes.outputs.smoke == 'true'
        run: make build
      - name: browser smoke, install Chromium
        if: needs.changes.outputs.smoke == 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: browser smoke
        if: needs.changes.outputs.smoke == 'true'
        env:
          SPOOL_SMOKE_TRACE: ${{ runner.temp }}/smoke-trace.zip
        run: bash scripts/fixture-hub.sh npm run -s test:smoke
      # The trace holds the fixture hub's operator token, which cmd/uifixture
      # seeds as a synthetic value, so the public artifact carries no
      # credential.
      - name: browser smoke, keep the trace
        if: failure() && needs.changes.outputs.smoke == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-trace
          path: ${{ runner.temp }}/smoke-trace.zip
          if-no-files-found: ignore
          retention-days: 7

      # The event-driven workflows are the blind spot these two steps exist
      # for: they fire on issues, comments and schedules, so no PR ever runs
      # them and a broken one is green here and dead in the Actions tab
      # (#203, #207, #209). The rules are checks on the file, which is the
      # only thing a PR can see; the run from the branch that proves the rest
      # is the author's job, linked in the PR's Verification section
      # (CONVENTIONS.md).
      - name: the rules still catch the incidents they name
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/workflow-lint-test.sh
      # The sentinel's step is inline YAML, so this harness extracts and runs
      # it; nothing else exercises it before it ships (#210).
      - name: the failure sentinel still reports what it claims to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/ci-health-test.sh
      # The coverage report is informational, so nothing else would notice it
      # miscounting (#2).
      - name: the diff coverage still counts what it claims to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/diff-coverage-test.sh
      - name: the test-failure annotations still name what they claim to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/test-failures-test.sh
      - name: the comment check still catches what it claims to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/comment-refs-test.sh
      # pr-guards runs the script on the PR in front of it, which says only
      # that this PR passes; the fixtures are what say it still refuses (#634).
      - name: the other-half check still refuses what it claims to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/other-half-test.sh
      # The advisory scan runs on a schedule, so this is what a PR can see
      # of its filing step: the tools' real output, a stubbed `gh` (#737).
      - name: the advisory scan still files what it claims to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/advisories-test.sh
      # Loops run it as a hook, where a wrong filter would read as all
      # green; the stub applies the script's own filters (#904).
      - name: the PR watch still reports what it claims to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/pr-watch-test.sh
      # The list decides which PRs get a security review; a pattern that
      # stopped matching would drop a path from review with every PR green
      # (#742).
      - name: the security-review paths still match what they claim to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/security-paths-test.sh
      # Restore is run once in anger, after the data is already gone, so a
      # backup that silently stopped copying volumes or started copying
      # hub.key into the data file would surface then and no sooner (#708).
      - name: the backup and restore still round-trip what they claim to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/spool-backup-test.sh
      # The smoke is what tells a broken release from a good one, and it runs
      # on a dispatch or a tag only; these say it still stops on each thing
      # it checks (#770).
      - name: the release smoke still stops on what it claims to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/release-smoke-test.sh
      # The queue runs on main's pushes and on label events, so this is what
      # a PR can see of it: its writing steps against a stub `gh`, and its
      # rebase against a real repository (#819).
      - name: the merge queue still marks and tests what it claims to
        if: needs.changes.outputs.workflows == 'true'
        run: bash scripts/queue-test.sh

  # The one job still filtered at job level, because it is the one worth
  # skipping outright: ~8 of the ~10 minutes a full run used to bill. A job
  # skipped by an `if:` reports a `skipped` check, which branch protection
  # counts as passed — unlike a workflow-level skip, which leaves the check
  # pending forever (#232 records the run this was verified on).
  itest:
    needs: changes
    if: needs.changes.outputs.itest == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # As in `changes`: the queued PR rebased onto main (#819).
      - name: the queued PR, rebased onto main
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          BASE_SHA: ${{ inputs.base }}
        run: bash scripts/queue-tree.sh "$PR" "$HEAD_SHA" "$BASE_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: integration tests (tier 2, vs fakeclaude)
        run: |
          set -o pipefail
          make itest 2>&1 | tee go-test.log
      # As in `checks` (#839).
      - name: name the failed tests
        if: failure()
        run: bash scripts/test-failures.sh go-test.log "tier 2"
      # Lever 5: only reached when the tests passed. The marker's content is
      # nothing; its key is the claim.
      - name: remember that this content passed
        run: touch .itest-green
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .itest-green
          key: ${{ needs.changes.outputs.itest_key }}
